name: CI
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: ./mvnw test -Dtest='!*IT'   # exclude integration tests by naming convention

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - run: ./mvnw test -Dtest='*IT'   # Testcontainers-backed integration tests only

  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4
      - uses: docker/build-push-action@v7.4
        with:
          context: .
          push: false
          load: true   # so the image lands in the local Docker daemon for Trivy to scan
          tags: task-queue:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: task-queue:ci
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'   # report only — never fails the build
      - name: Upload scan results to the Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  docker-publish:
    needs: [ unit-tests, integration-tests, docker-build ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jjetta/task-queue:latest
            ghcr.io/jjetta/task-queue:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max